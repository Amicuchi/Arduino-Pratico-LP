    <!-- Schema.org: FAQPage — habilita o rich snippet de perguntas expansíveis no Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Preciso ter o Arduino para usar o ebook?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não! O ebook ensina a usar simuladores online como o Tinkercad, então você pode começar a aprender e praticar mesmo sem ter a placa física. Quando decidir comprar, você já vai saber exatamente o que está fazendo."
            }
          },
          {
            "@type": "Question",
            "name": "O ebook é físico ou digital?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "É um Ebook em PDF, entregue imediatamente no seu e-mail após a confirmação do pagamento. Você pode ler no computador, tablet ou celular, e imprimir se preferir."
            }
          },
          {
            "@type": "Question",
            "name": "Serve para crianças?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Com supervisão de um adulto, é uma ótima atividade de pai e filho. O conteúdo foi originalmente criado para ensinar uma criança de 6 anos, então a linguagem é bem acessível."
            }
          },
          {
            "@type": "Question",
            "name": "Recebo só um ebook ou mais de um?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você recebe os 4 e-books do pacote: o Eletrônica Básica com Arduino e mais 3 bônus: 19 Componentes Essenciais, Guia Completo do 555 e Do L298N ao IBT-2 (drivers de motor DC). Todos ficam disponíveis na sua área de membros assim que a compra é aprovada, sem custo extra."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso saber programar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não! O ebook começa do zero absoluto. Você vai aprender os fundamentos de programação junto com a eletrônica, de forma prática e sem complicação."
            }
          },
          {
            "@type": "Question",
            "name": "Qual a diferença desse ebook para tutoriais gratuitos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A principal diferença é a organização e didática. Tutoriais gratuitos são fragmentados e muitas vezes pulam conceitos importantes de segurança. Aqui você tem um caminho estruturado, do básico ao avançado, com foco em não queimar componentes."
            }
          },
          {
            "@type": "Question",
            "name": "E se eu não gostar do material?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você tem 7 dias de garantia incondicional. Se por qualquer motivo você não ficar satisfeito, basta solicitar o reembolso e devolvemos 100% do seu dinheiro, sem perguntas."
            }
          },
          {
            "@type": "Question",
            "name": "Posso imprimir meu ebook para usar fisicamente?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! O ebook foi desenvolvido pensando também em quem prefere estudar com material impresso. Você pode imprimir o PDF e criar sua própria versão física do livro."
            }
          },
          {
            "@type": "Question",
            "name": "Como recebo o material?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Imediatamente após a confirmação do pagamento, você recebe um e-mail com o link para download do ebook e do pack de códigos bônus. PIX e cartão são aprovados na hora!"
            }
          },
          {
            "@type": "Question",
            "name": "Posso tirar dúvidas com o autor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Você terá acesso a um canal de suporte para tirar suas dúvidas sobre o conteúdo do ebook."
            }
          }
        ]
      }
    </script>

    <!-- Google tag (gtag.js) — GA4 (navegação/funil) + Google Ads (remarketing) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-416CGR86JE"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // send_page_view: false porque este é um app de página única (SPA) —
      // quem envia o page_view a cada troca de rota é o PageViewTracker
      // (src/lib/PageViewTracker.jsx), senão o GA4 só veria a 1ª página.
      gtag("config", "G-416CGR86JE", { send_page_view: false });
      gtag("config", "AW-18265777984");

      // O evento de CONVERSÃO (compra) não é mais disparado aqui.

      // aconteceu — por isso o disparo correto é configurado DENTRO da
      // Hotmart (Ferramentas > Pixel de Rastreamento > Google Ads), usando:
      //   ID de conversão:   AW-18265777984
